<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morph — convert, merge, edit anything</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d13; --bg-soft:#0d1119;
    --panel:#12161f; --panel2:#171c28; --panel3:#1c2230;
    --line:#242b3d; --line-soft:#1a2030;
    --text:#eceef3; --text-dim:#8891a3; --text-faint:#565e73;
    --accent:#eba648; --accent-ink:#1c1408; --accent-soft:rgba(235,166,72,.13);
    --accent2:#52d6c9; --accent2-soft:rgba(82,214,201,.13);
    --danger:#ea6763; --danger-soft:rgba(234,103,99,.13);
    --radius:16px; --radius-sm:10px;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --disp:'Space Grotesk', sans-serif;
    --body:'Inter', sans-serif;
    --shadow: 0 20px 50px -20px rgba(0,0,0,.6);
  }
  html[data-theme="light"]{
    --bg:#f3f1ea; --bg-soft:#eeece3;
    --panel:#ffffff; --panel2:#f7f5ee; --panel3:#efece2;
    --line:#e2ddcd; --line-soft:#ece7d8;
    --text:#211f1a; --text-dim:#6c6656; --text-faint:#9b947e;
    --accent:#c8791f; --accent-ink:#fff8ec; --accent-soft:rgba(200,121,31,.10);
    --accent2:#0e8f83; --accent2-soft:rgba(14,143,131,.10);
    --danger:#c73f3a; --danger-soft:rgba(199,63,58,.10);
    --shadow: 0 20px 50px -25px rgba(80,60,20,.25);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse 1000px 560px at 12% -12%, var(--accent-soft), transparent 60%),
      radial-gradient(ellipse 800px 560px at 105% 0%, var(--accent2-soft), transparent 60%),
      var(--bg);
    color:var(--text); font-family:var(--body); min-height:100vh;
    -webkit-font-smoothing:antialiased; transition:background .3s, color .3s;
  }
  ::selection{ background:var(--accent-soft); }
  a{ color:var(--accent2); }
  button, select, input{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent2); outline-offset:2px; border-radius:4px; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .wrap{ max-width:1080px; margin:0 auto; padding:0 22px 90px; }

  /* header */
  header.topbar{
    display:flex; align-items:center; gap:14px; padding:30px 0 24px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .logo-mark{ position:relative; width:38px; height:38px; flex:none; }
  .logo-mark svg{ display:block; }
  .brand-text h1{
    font-family:var(--disp); font-weight:700; font-size:23px; margin:0; letter-spacing:-.01em;
    background:linear-gradient(90deg, var(--text), var(--text) 60%, var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand-text p{ margin:2px 0 0; font-size:12.5px; color:var(--text-dim); }
  .top-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }

  .icon-toggle{
    width:36px; height:36px; border-radius:10px; background:var(--panel); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-dim); transition:.15s;
  }
  .icon-toggle:hover{ color:var(--accent); border-color:var(--accent); }

  .engine-badge{
    display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px;
    color:var(--text-dim); background:var(--panel); border:1px solid var(--line);
    padding:7px 12px; border-radius:999px; white-space:nowrap;
  }
  .engine-dot{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex:none; }
  .engine-badge.loading .engine-dot{ background:var(--accent); animation:pulse 1s ease-in-out infinite; }
  .engine-badge.ready .engine-dot{ background:var(--accent2); }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }

  /* nav */
  nav.maintabs{ display:flex; gap:8px; margin-bottom:28px; flex-wrap:wrap; }
  .maintab{
    display:flex; align-items:center; gap:8px; font-family:var(--disp); font-weight:600; font-size:13.5px;
    color:var(--text-dim); background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:10px 18px; cursor:pointer; transition:.15s;
  }
  .maintab svg{ width:15px; height:15px; opacity:.8; }
  .maintab:hover{ color:var(--text); border-color:var(--accent); }
  .maintab.active{ color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }
  .maintab.active svg{ opacity:1; }

  .panel{ display:none; animation:fadein .25s ease; }
  .panel.active{ display:block; }
  @keyframes fadein{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }

  .section-title{ font-family:var(--disp); font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin:0 0 16px; font-weight:600; }

  /* glass card */
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); transition:.2s;
  }

  footer{ text-align:center; font-size:11px; color:var(--text-faint); margin-top:50px; font-family:var(--mono); }

  /* ---------- buttons / forms (shared) ---------- */
  .btn{
    font-family:var(--disp); font-weight:600; font-size:12.5px; border-radius:9px; padding:9px 16px;
    cursor:pointer; border:1px solid var(--line); background:var(--panel2); color:var(--text); transition:.15s;
  }
  .btn:hover{ border-color:var(--accent); color:var(--accent); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover{ filter:brightness(1.07); color:var(--accent-ink); border-color:var(--accent); }
  .btn.ghost{ background:transparent; }
  .btn.danger{ color:var(--danger); border-color:transparent; background:transparent; }
  .btn.danger:hover{ border-color:var(--danger); }
  .btn.block{ width:100%; text-align:center; }
  .btn.sm{ padding:6px 11px; font-size:11.5px; border-radius:7px; }

  label.field-label, .field-label{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.07em; margin-bottom:7px; }
  select.ctl, input.ctl{
    width:100%; font-family:var(--mono); font-size:12.5px; background:var(--panel3); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:10px 11px; cursor:pointer;
  }
  input.ctl{ cursor:text; }
  input.ctl::placeholder{ color:var(--text-faint); }
  select.ctl:hover, input.ctl:hover{ border-color:var(--accent); }
  input[type=range].ctl{ cursor:pointer; padding:0; height:6px; accent-color:var(--accent); }
  .field-row{ margin-bottom:14px; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .checkline{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim); margin-bottom:14px; }
  .checkline input{ accent-color:var(--accent); width:15px; height:15px; }

  /* ---------- dropzone ---------- */
  .dropzone{
    border:1.5px dashed var(--line); border-radius:var(--radius-sm); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; cursor:pointer; padding:30px 20px;
    transition:.15s; gap:10px; min-height:180px;
  }
  .dropzone:hover, .dropzone.drag{ border-color:var(--accent); background:var(--accent-soft); }
  .dropzone svg{ opacity:.7; }
  .dropzone p{ margin:0; font-size:12.5px; color:var(--text-dim); }
  .dropzone input{ display:none; }

  .file-card{ display:flex; align-items:center; gap:12px; padding:14px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--panel2); }
  .file-icon{
    width:40px; height:40px; border-radius:9px; background:var(--panel3); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:10px;
    color:var(--accent); font-weight:600; flex:none;
  }
  .file-meta{ min-width:0; flex:1; }
  .file-meta .file-name{ font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .file-meta .file-sub{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); margin-top:2px; }

  /* ---------- convert layout ---------- */
  .convert-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  @media (max-width:760px){ .convert-grid{ grid-template-columns:1fr; } }
  .box{ padding:22px; }
  .box-num{ font-family:var(--mono); font-size:10.5px; color:var(--accent); letter-spacing:.09em; margin-bottom:6px; }
  .box h2{ font-family:var(--disp); font-size:15px; margin:0 0 16px; font-weight:600; }
  .placeholder{ display:flex; align-items:center; justify-content:center; min-height:160px; color:var(--text-faint); font-size:12.5px; text-align:center; padding:20px; }

  .status-line{ font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:10px; min-height:15px; }
  .status-line.err{ color:var(--danger); }
  .status-line.ok{ color:var(--accent2); }
  .progress-track{ height:5px; border-radius:3px; background:var(--panel3); overflow:hidden; margin-top:10px; display:none; }
  .progress-track.show{ display:block; }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--accent), var(--accent2)); transition:width .2s; }

  .preview-wrap{ margin-top:16px; }
  .preview-box{ border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--panel3); overflow:auto; max-height:280px; }
  .preview-box.checker{ background-image: linear-gradient(45deg,#00000022 25%,transparent 25%),linear-gradient(-45deg,#00000022 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#00000022 75%),linear-gradient(-45deg,transparent 75%,#00000022 75%); background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0; }
  .preview-box img{ display:block; max-width:100%; }
  .preview-box audio, .preview-box video{ display:block; width:100%; }
  .preview-box video{ max-height:280px; }
  .preview-box pre{ margin:0; padding:14px; font-family:var(--mono); font-size:11px; color:var(--text-dim); white-space:pre-wrap; word-break:break-word; }
  .preview-box textarea{ width:100%; min-height:180px; border:none; background:transparent; color:var(--text-dim); font-family:var(--mono); font-size:11.5px; padding:14px; resize:vertical; }
  .preview-box table{ border-collapse:collapse; width:100%; font-family:var(--mono); font-size:11px; }
  .preview-box th, .preview-box td{ border:1px solid var(--line); padding:6px 9px; text-align:left; white-space:nowrap; }
  .preview-box th{ background:var(--panel2); color:var(--accent); }
  .download-btn{
    display:block; text-align:center; text-decoration:none; margin-top:10px; font-family:var(--disp);
    font-weight:600; font-size:12.5px; background:var(--panel2); border:1px solid var(--accent2); color:var(--accent2);
    padding:11px; border-radius:9px; transition:.15s;
  }
  .download-btn:hover{ background:var(--accent2-soft); }
  .preview-actions{ display:flex; gap:8px; margin-top:10px; }
  .preview-actions .btn{ flex:1; }

  /* image tools grid under convert */
  .imgtools{ margin-top:20px; }
  .imgtools-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .imgtool-btn{
    display:flex; flex-direction:column; align-items:center; gap:7px; padding:16px 10px; border-radius:12px;
    background:var(--panel2); border:1px solid var(--line); cursor:pointer; transition:.15s; text-align:center;
  }
  .imgtool-btn:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .imgtool-btn svg{ width:20px; height:20px; color:var(--accent); }
  .imgtool-btn span{ font-family:var(--disp); font-size:12px; font-weight:600; }
  .imgtool-panel{ margin-top:14px; padding:16px; border-radius:var(--radius-sm); background:var(--panel2); border:1px solid var(--line); display:none; }
  .imgtool-panel.show{ display:block; }

  /* crop overlay */
  .crop-stage{ position:relative; display:inline-block; max-width:100%; touch-action:none; user-select:none; }
  .crop-stage img{ display:block; max-width:100%; border-radius:6px; }
  .crop-rect{ position:absolute; border:2px solid var(--accent); box-shadow:0 0 0 2000px rgba(0,0,0,.5); cursor:move; }
  .crop-handle{ position:absolute; width:12px; height:12px; background:var(--accent); border-radius:3px; }
  .crop-handle.nw{ top:-6px; left:-6px; cursor:nwse-resize; }
  .crop-handle.ne{ top:-6px; right:-6px; cursor:nesw-resize; }
  .crop-handle.sw{ bottom:-6px; left:-6px; cursor:nesw-resize; }
  .crop-handle.se{ bottom:-6px; right:-6px; cursor:nwse-resize; }

  /* ---------- tool cards (Tools panel) ---------- */
  .tool-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin-bottom:10px; }
  .tool-card{ padding:20px; cursor:pointer; transition:.18s; }
  .tool-card:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .tool-card .ti{ width:38px; height:38px; border-radius:10px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .tool-card .ti svg{ width:19px; height:19px; color:var(--accent); }
  .tool-card h3{ font-family:var(--disp); font-size:14.5px; margin:0 0 5px; font-weight:600; }
  .tool-card p{ margin:0; font-size:11.5px; color:var(--text-dim); line-height:1.5; }

  .tool-detail{ padding:24px; margin-top:6px; }
  .tool-detail-head{ display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .tool-detail-head h3{ font-family:var(--disp); font-size:16px; margin:0; font-weight:600; }
  .back-link{ font-family:var(--mono); font-size:11.5px; color:var(--text-dim); cursor:pointer; background:none; border:none; display:flex; align-items:center; gap:5px; padding:0; }
  .back-link:hover{ color:var(--accent); }

  .multi-list{ display:flex; flex-direction:column; gap:8px; margin:14px 0; }
  .multi-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--panel2); }
  .multi-item .idx{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); width:18px; }
  .multi-item .nm{ flex:1; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .multi-item .sz{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); }
  .multi-item .iconbtns{ display:flex; gap:4px; }
  .mini-icon{ width:24px; height:24px; border-radius:6px; border:1px solid var(--line); background:var(--panel3); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-dim); font-size:11px; }
  .mini-icon:hover{ color:var(--accent); border-color:var(--accent); }

  /* ---------- batch queue ---------- */
  .queue-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .queue-actions{ display:flex; gap:8px; }
  .queue{ display:flex; flex-direction:column; gap:10px; }
  .qrow{ padding:13px 15px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .qrow .row-info{ min-width:0; flex:1 1 180px; }
  .qrow .row-name{ font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .qrow .row-meta{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); margin-top:2px; }
  .route{ display:flex; align-items:center; gap:9px; flex:1 1 240px; min-width:200px; }
  .fmt-node{ font-family:var(--mono); font-size:10.5px; font-weight:500; background:var(--panel3); border:1px solid var(--line); color:var(--text-dim); padding:5px 8px; border-radius:5px; flex:none; }
  .signal{ position:relative; height:2px; background:var(--line); flex:1; min-width:36px; border-radius:2px; }
  .signal .dot{ position:absolute; top:50%; left:0; width:7px; height:7px; border-radius:50%; background:var(--accent); transform:translate(-50%,-50%); box-shadow:0 0 8px var(--accent-soft); }
  .signal.converting .dot{ animation:travel 1.05s ease-in-out infinite; }
  @keyframes travel{ 0%{ left:0; opacity:.35; } 50%{ opacity:1; } 100%{ left:100%; opacity:.35; } }
  .signal.done{ background:var(--accent2); } .signal.done .dot{ left:100%; background:var(--accent2); }
  .signal.error{ background:var(--danger); } .signal.error .dot{ left:100%; background:var(--danger); }
  select.target-sm{ font-family:var(--mono); font-size:11px; background:var(--panel3); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; cursor:pointer; flex:none; }
  .qstatus{ flex:1 1 130px; min-width:110px; font-family:var(--mono); font-size:10.5px; color:var(--text-dim); }
  .qstatus.err{ color:var(--danger); } .qstatus.ok{ color:var(--accent2); }
  .qactions{ display:flex; gap:6px; align-items:center; flex:none; }
  .empty-hint{ font-size:12.5px; color:var(--text-faint); text-align:center; padding:26px 0; }

  /* ---------- history ---------- */
  table.hist{ width:100%; border-collapse:collapse; }
  table.hist th{ text-align:left; font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); padding:12px 16px; border-bottom:1px solid var(--line); }
  table.hist td{ padding:12px 16px; border-bottom:1px solid var(--line-soft); font-size:12.5px; }
  table.hist td.mono{ font-family:var(--mono); font-size:11px; color:var(--text-dim); }
  table.hist tr:last-child td{ border-bottom:none; }

  /* ---------- toast ---------- */
  #toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--panel3); border:1px solid var(--line); color:var(--text); padding:11px 18px; border-radius:10px; font-size:12.5px; opacity:0; pointer-events:none; transition:.25s; z-index:999; box-shadow:var(--shadow); }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .notes{ margin-top:26px; font-size:12px; color:var(--text-faint); line-height:1.6; }
  .notes ul{ margin:6px 0 0; padding-left:18px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <div class="logo-mark">
        <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
          <rect x="1" y="1" width="36" height="36" rx="11" fill="var(--panel)" stroke="var(--line)"/>
          <path d="M10 26 L14 12 L19 22 L24 12 L28 26" stroke="var(--accent)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="14" cy="12" r="1.8" fill="var(--accent2)"/>
          <circle cx="24" cy="12" r="1.8" fill="var(--accent2)"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Morph</h1>
        <p>Convert, merge, and edit any file — entirely in your browser.</p>
      </div>
    </div>
    <div class="top-right">
      <div class="engine-badge" id="engineBadge"><span class="engine-dot"></span><span id="engineText">Engine idle</span></div>
      <button class="icon-toggle" id="themeToggle" title="Toggle theme">
        <svg id="themeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </header>

  <nav class="maintabs" id="maintabs">
    <button class="maintab active" data-panel="convert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h11m0 0-4-4m4 4-4 4M20 12H9m0 0 4-4m-4 4 4 4"/></svg>Convert</button>
    <button class="maintab" data-panel="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>Tools</button>
    <button class="maintab" data-panel="batch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Batch</button>
    <button class="maintab" data-panel="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l4 2"/></svg>History</button>
  </nav>

  <!-- ============ CONVERT PANEL ============ -->
  <section class="panel active" id="panel-convert"></section>

  <!-- ============ TOOLS PANEL ============ -->
  <section class="panel" id="panel-tools"></section>

  <!-- ============ BATCH PANEL ============ -->
  <section class="panel" id="panel-batch"></section>

  <!-- ============ HISTORY PANEL ============ -->
  <section class="panel" id="panel-history"></section>

  <footer>morph · local-only file conversion · nothing ever leaves your device</footer>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.js"></script>

<script>
(function(){
'use strict';

/* ============================================================
   FORMAT REGISTRY
   ============================================================ */
var DOC_MATRIX = {
  pdf:  ['docx','txt','md','odt','html','csv','jpg','png'],
  docx: ['pdf','txt','md','odt','html'],
  doc:  ['pdf','docx','txt','md','odt'],
  txt:  ['pdf','docx','md','html'],
  odt:  ['pdf','docx','txt','md'],
  md:   ['pdf','docx','html','txt'],
  csv:  ['xlsx','json','xml','pdf'],
  xlsx: ['csv','pdf','json','xml'],
  xml:  ['json','csv'],
  json: ['xml','csv']
};
var DOC_FORMATS = Object.keys(DOC_MATRIX);
var IMG_FORMATS = ['jpg','png','gif','webp','svg'];
var AUDIO_FORMATS = ['mp3','wav','m4a'];
var VIDEO_FORMATS = ['mp4','mov'];
var EXT_ALIAS = { jpeg:'jpg' };

var MIME_MAP = {
  pdf:'application/pdf', docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  txt:'text/plain', xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  odt:'application/vnd.oasis.opendocument.text', md:'text/markdown', csv:'text/csv',
  xml:'application/xml', json:'application/json', html:'text/html', zip:'application/zip',
  jpg:'image/jpeg', png:'image/png', gif:'image/gif', webp:'image/webp', svg:'image/svg+xml',
  mp3:'audio/mpeg', wav:'audio/wav', m4a:'audio/mp4', mp4:'video/mp4', mov:'video/quicktime'
};

function normExt(name){ var e=(name.split('.').pop()||'').toLowerCase(); return EXT_ALIAS[e]||e; }
function categoryOf(ext){
  if (DOC_FORMATS.indexOf(ext)!==-1) return 'doc';
  if (IMG_FORMATS.indexOf(ext)!==-1) return 'img';
  if (AUDIO_FORMATS.indexOf(ext)!==-1) return 'audio';
  if (VIDEO_FORMATS.indexOf(ext)!==-1) return 'video';
  return null;
}
function targetsFor(ext, category){
  if (category==='doc') return (DOC_MATRIX[ext]||[]).slice();
  if (category==='img') return IMG_FORMATS.filter(function(f){return f!==ext;}).concat([ext]);
  if (category==='audio') return AUDIO_FORMATS.filter(function(f){return f!==ext;}).concat([ext]);
  if (category==='video') return VIDEO_FORMATS.filter(function(f){return f!==ext;}).concat(AUDIO_FORMATS).concat(['gif']).concat([ext]);
  return [];
}

/* ---------------- utils ---------------- */
function formatBytes(n){ if(n<1024) return n+' B'; if(n<1024*1024) return (n/1024).toFixed(1)+' KB'; return (n/1024/1024).toFixed(2)+' MB'; }
function escapeXml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function blobToDataURL(blob){ return new Promise(function(resolve,reject){ var r=new FileReader(); r.onload=function(){resolve(r.result);}; r.onerror=reject; r.readAsDataURL(blob); }); }
function sanitizeTag(s){ var t=String(s||'field').trim().replace(/[^a-zA-Z0-9_]/g,'_'); if(!t)t='field'; if(/^[0-9]/.test(t))t='_'+t; return t; }
function baseName(name){ var i=name.lastIndexOf('.'); return i>0?name.slice(0,i):name; }
var toastTimer=null;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
}
var loadedScripts = {};
function loadScriptOnce(src){
  if (loadedScripts[src]) return loadedScripts[src];
  loadedScripts[src] = new Promise(function(resolve,reject){
    var s=document.createElement('script'); s.src=src;
    s.onload=function(){resolve();}; s.onerror=function(){reject(new Error('Failed to load '+src));};
    document.head.appendChild(s);
  });
  return loadedScripts[src];
}
var moduleCache = {};
function importOnce(url){
  if (moduleCache[url]) return moduleCache[url];
  moduleCache[url] = import(/* webpackIgnore: true */ url);
  return moduleCache[url];
}

/* ---------------- history log (localStorage) ---------------- */
function logHistory(entry){
  try{
    var list = JSON.parse(localStorage.getItem('morph_history')||'[]');
    entry.time = Date.now();
    list.unshift(entry);
    if (list.length>60) list = list.slice(0,60);
    localStorage.setItem('morph_history', JSON.stringify(list));
  }catch(e){}
  if (window.renderHistory) window.renderHistory();
}

/* ---------------- CSV ---------------- */
function parseCSV(text){
  var rows=[],row=[],field='',inQuotes=false;
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for (var i=0;i<text.length;i++){
    var c=text[i];
    if (inQuotes){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else {inQuotes=false;} } else { field+=c; } }
    else {
      if (c==='"'){ inQuotes=true; }
      else if (c===','){ row.push(field); field=''; }
      else if (c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else { field+=c; }
    }
  }
  row.push(field); rows.push(row);
  while (rows.length && rows[rows.length-1].length===1 && rows[rows.length-1][0]==='') rows.pop();
  return rows;
}
function writeCSV(rows){
  return rows.map(function(row){
    return row.map(function(cell){
      var s=String(cell==null?'':cell);
      if (/[",\n]/.test(s)) s='"'+s.replace(/"/g,'""')+'"';
      return s;
    }).join(',');
  }).join('\r\n');
}

/* ---------------- doc model helpers ---------------- */
function mdTable(rows){
  if(!rows.length) return '';
  var header=rows[0], body=rows.slice(1);
  var out='| '+header.map(function(h){return String(h==null?'':h).replace(/\|/g,'\\|');}).join(' | ')+' |\n';
  out += '| '+header.map(function(){return '---';}).join(' | ')+' |\n';
  body.forEach(function(r){ out += '| '+header.map(function(_,i){return String(r[i]==null?'':r[i]).replace(/\|/g,'\\|');}).join(' | ')+' |\n'; });
  return out;
}
function rowsToObjects(rows){
  if(!rows.length) return [];
  var header=rows[0];
  return rows.slice(1).map(function(r){ var o={}; header.forEach(function(h,i){ o[h||('col'+(i+1))]=r[i]==null?'':r[i]; }); return o; });
}
function objectsToRows(arr){
  var keys=[];
  arr.forEach(function(o){ Object.keys(o).forEach(function(k){ if(keys.indexOf(k)===-1) keys.push(k); }); });
  var rows=[keys];
  arr.forEach(function(o){ rows.push(keys.map(function(k){ return o[k]==null?'':o[k]; })); });
  return rows;
}

/* ---------------- extraction ---------------- */
function extractTXT(file){ return file.text().then(function(t){ return {text:t}; }); }
function extractMD(file){ return file.text().then(function(t){ var html=''; try{html=window.marked.parse(t);}catch(e){} return {text:t, html:html}; }); }
function extractDOCX(file){
  return file.arrayBuffer().then(function(buf){
    return Promise.all([ window.mammoth.convertToHtml({arrayBuffer:buf}), window.mammoth.extractRawText({arrayBuffer:buf}) ])
      .then(function(res){ return {html:res[0].value, text:res[1].value}; });
  });
}
function extractDOC(){ return Promise.reject(new Error('Legacy .doc files can\'t be parsed in-browser — save as .docx in Word and re-upload.')); }
function extractPDF(file){
  return file.arrayBuffer().then(function(buf){
    return window.pdfjsLib.getDocument({data:buf}).promise.then(function(pdf){
      var pagePromises=[];
      for (var i=1;i<=pdf.numPages;i++){
        pagePromises.push(pdf.getPage(i).then(function(page){
          return page.getTextContent().then(function(content){ return content.items.map(function(it){return it.str;}).join(' '); });
        }));
      }
      return Promise.all(pagePromises).then(function(pages){ return {text: pages.join('\n\n')}; });
    });
  });
}
function extractODT(file){
  return file.arrayBuffer().then(function(buf){
    return window.JSZip.loadAsync(buf).then(function(zip){
      var entry = zip.file('content.xml');
      if (!entry) return {text:''};
      return entry.async('string').then(function(xmlText){
        var doc = new DOMParser().parseFromString(xmlText,'application/xml');
        var TEXT_NS='urn:oasis:names:tc:opendocument:xmlns:text:1.0';
        var ps=doc.getElementsByTagNameNS(TEXT_NS,'p'), hs=doc.getElementsByTagNameNS(TEXT_NS,'h');
        var all=[]; for(var i=0;i<ps.length;i++) all.push(ps[i]); for(var j=0;j<hs.length;j++) all.push(hs[j]);
        all.sort(function(a,b){ var pos=a.compareDocumentPosition(b); return (pos & Node.DOCUMENT_POSITION_FOLLOWING)?-1:1; });
        var paras = all.map(function(node){ return node.textContent||''; });
        return { text: paras.join('\n\n'), html: paras.map(function(p){return '<p>'+escapeHtml(p)+'</p>';}).join('\n') };
      });
    });
  });
}
function extractXLSX(file){
  return file.arrayBuffer().then(function(buf){
    var wb = window.XLSX.read(buf,{type:'array'});
    var ws = wb.Sheets[wb.SheetNames[0]];
    var rows = window.XLSX.utils.sheet_to_json(ws,{header:1, defval:''});
    return { rows:rows, hasHeader:true, text: rows.map(function(r){return r.join('\t');}).join('\n') };
  });
}
function extractCSVFile(file){ return file.text().then(function(t){ return {rows:parseCSV(t), hasHeader:true, text:t}; }); }
function extractJSONFile(file){
  return file.text().then(function(t){
    var parsed; try{ parsed=JSON.parse(t); }catch(e){ throw new Error('Invalid JSON'); }
    if (Array.isArray(parsed) && parsed.length && parsed.every(function(x){return x&&typeof x==='object'&&!Array.isArray(x);})){
      return { rows: objectsToRows(parsed), hasHeader:true, text: JSON.stringify(parsed,null,2) };
    }
    return { text: JSON.stringify(parsed,null,2) };
  });
}
function extractXMLFile(file){
  return file.text().then(function(t){
    var doc = new DOMParser().parseFromString(t,'application/xml');
    if (doc.getElementsByTagName('parsererror').length) return {text:t};
    var root = doc.documentElement;
    var children = Array.prototype.filter.call(root.children||[], function(c){return c.nodeType===1;});
    var tagNames = children.map(function(c){return c.tagName;});
    var uniform = tagNames.length>0 && tagNames.every(function(tn){return tn===tagNames[0];});
    if (uniform){
      var header=[];
      var records = children.map(function(rec){
        var obj={};
        Array.prototype.forEach.call(rec.children, function(field){
          if (header.indexOf(field.tagName)===-1) header.push(field.tagName);
          obj[field.tagName]=field.textContent;
        });
        return obj;
      });
      if (header.length){
        var rows=[header];
        records.forEach(function(r){ rows.push(header.map(function(h){return r[h]==null?'':r[h];})); });
        return { rows:rows, hasHeader:true, text:t };
      }
    }
    return { text:t };
  });
}

/* ---------------- generation ---------------- */
function generateTXT(model){
  var out = model.text;
  if (out==null && model.rows) out = model.rows.map(function(r){return r.join('\t');}).join('\n');
  return Promise.resolve(new Blob([out||''],{type:'text/plain'}));
}
function generateMD(model){
  var out;
  if (model.rows && model.rows.length){ out = mdTable(model.rows); }
  else if (model.html){ out = new window.TurndownService().turndown(model.html); }
  else { out = model.text || ''; }
  return Promise.resolve(new Blob([out],{type:'text/markdown'}));
}
function generateCSV(model){
  var rows = model.rows || (model.text||'').split('\n').map(function(l){return [l];});
  return Promise.resolve(new Blob([writeCSV(rows)],{type:'text/csv'}));
}
function generateJSON(model){
  var out;
  if (model.rows && model.rows.length){ out = JSON.stringify(rowsToObjects(model.rows),null,2); }
  else { out = JSON.stringify({content: model.text||''}, null, 2); }
  return Promise.resolve(new Blob([out],{type:'application/json'}));
}
function generateXML(model){
  var out;
  if (model.rows && model.rows.length){
    var header = model.rows[0].map(sanitizeTag);
    var body = model.rows.slice(1);
    var rowsXml = body.map(function(r){
      var fields = header.map(function(h,i){ return '<'+h+'>'+escapeXml(r[i])+'</'+h+'>'; }).join('');
      return '  <row>'+fields+'</row>';
    }).join('\n');
    out = '<?xml version="1.0" encoding="UTF-8"?>\n<records>\n'+rowsXml+'\n</records>';
  } else {
    out = '<?xml version="1.0" encoding="UTF-8"?>\n<document>\n  <content>'+escapeXml(model.text||'')+'</content>\n</document>';
  }
  return Promise.resolve(new Blob([out],{type:'application/xml'}));
}
function generateXLSX(model){
  var rows = model.rows || (model.text||'').split('\n').map(function(l){return [l];});
  var ws = window.XLSX.utils.aoa_to_sheet(rows);
  var wb = window.XLSX.utils.book_new();
  window.XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  var out = window.XLSX.write(wb,{bookType:'xlsx', type:'array'});
  return Promise.resolve(new Blob([out],{type:MIME_MAP.xlsx}));
}
function generateHTML(model){
  var bodyContent;
  if (model.rows && model.rows.length){
    bodyContent = '<table>'+model.rows.map(function(r,ri){
      var tag = ri===0?'th':'td';
      return '<tr>'+r.map(function(c){return '<'+tag+'>'+escapeHtml(c)+'</'+tag+'>';}).join('')+'</tr>';
    }).join('')+'</table>';
  } else if (model.html){ bodyContent = model.html; }
  else { bodyContent = (model.text||'').split(/\n{2,}/).map(function(p){ return '<p>'+escapeHtml(p).replace(/\n/g,'<br>')+'</p>'; }).join('\n'); }
  var out = '<!DOCTYPE html>\n<html><head><meta charset="UTF-8"><title>Document</title>'+
    '<style>body{font-family:sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.6;color:#222;}table{border-collapse:collapse;width:100%;}th,td{border:1px solid #ccc;padding:6px 10px;text-align:left;}th{background:#f0f0f0;}</style>'+
    '</head><body>\n'+bodyContent+'\n</body></html>';
  return Promise.resolve(new Blob([out],{type:'text/html'}));
}
function generatePDF(model){
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({unit:'pt', format:'a4'});
  var marginX=48, marginY=56;
  var pageW=doc.internal.pageSize.getWidth(), pageH=doc.internal.pageSize.getHeight();
  var maxW = pageW - marginX*2;
  doc.setFont('helvetica'); doc.setFontSize(11);
  var y=marginY;
  if (model.rows && model.rows.length){
    var rows=model.rows, cols=rows[0].length||1, colW=maxW/cols, rowH=20;
    rows.forEach(function(row,ri){
      if (y+rowH>pageH-marginY){ doc.addPage(); y=marginY; }
      row.forEach(function(cell,ci){
        var x=marginX+ci*colW;
        doc.setFont('helvetica', ri===0?'bold':'normal');
        doc.rect(x,y,colW,rowH);
        var t=doc.splitTextToSize(String(cell==null?'':cell), colW-6);
        doc.text(t[0]||'', x+3, y+14);
      });
      y+=rowH;
    });
  } else {
    var paragraphs=(model.text||'').split(/\n{2,}/);
    doc.setFont('helvetica','normal');
    paragraphs.forEach(function(p){
      var lines=doc.splitTextToSize(p, maxW);
      lines.forEach(function(line){
        if (y>pageH-marginY){ doc.addPage(); y=marginY; }
        doc.text(line, marginX, y); y+=15;
      });
      y+=10;
    });
  }
  return Promise.resolve(doc.output('blob'));
}
function generateDOCX(model){
  var bodyXml='';
  if (model.rows && model.rows.length){
    var rows=model.rows;
    bodyXml += '<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders>'+
      ['top','left','bottom','right','insideH','insideV'].map(function(e){return '<w:'+e+' w:val="single" w:sz="4" w:color="B0B4C0"/>';}).join('')+
      '</w:tblBorders></w:tblPr>';
    rows.forEach(function(r,ri){
      bodyXml += '<w:tr>';
      r.forEach(function(cell){
        var run = ri===0 ? '<w:rPr><w:b/></w:rPr>' : '';
        bodyXml += '<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/></w:tcPr><w:p><w:r>'+run+'<w:t xml:space="preserve">'+escapeXml(cell)+'</w:t></w:r></w:p></w:tc>';
      });
      bodyXml += '</w:tr>';
    });
    bodyXml += '</w:tbl><w:p/>';
  } else {
    (model.text||'').split(/\n{2,}/).forEach(function(p){
      var lines = p.split('\n');
      var runs = lines.map(function(l,i){ return (i>0?'<w:br/>':'')+'<w:t xml:space="preserve">'+escapeXml(l)+'</w:t>'; }).join('');
      bodyXml += '<w:p><w:r>'+runs+'</w:r></w:p>';
    });
  }
  var documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+bodyXml+
    '<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr>'+
    '</w:body></w:document>';
  var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
  var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  var zip = new window.JSZip();
  zip.file('[Content_Types].xml', contentTypes);
  zip.folder('_rels').file('.rels', rels);
  zip.folder('word').file('document.xml', documentXml);
  return zip.generateAsync({type:'blob', mimeType: MIME_MAP.docx});
}
function generateODT(model){
  var bodyXml='';
  if (model.rows && model.rows.length){
    bodyXml += '<table:table table:name="Table1">';
    model.rows.forEach(function(r){
      bodyXml += '<table:table-row>';
      r.forEach(function(cell){ bodyXml += '<table:table-cell office:value-type="string"><text:p>'+escapeXml(cell)+'</text:p></table:table-cell>'; });
      bodyXml += '</table:table-row>';
    });
    bodyXml += '</table:table>';
  } else {
    (model.text||'').split(/\n{2,}/).forEach(function(p){ bodyXml += '<text:p>'+escapeXml(p).replace(/\n/g,'<text:line-break/>')+'</text:p>'; });
  }
  var contentXml = '<?xml version="1.0" encoding="UTF-8"?>\n'+
    '<office:document-content xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" '+
    'xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:table="urn:oasis:names:tc:opendocument:xmlns:table:1.0" office:version="1.2">'+
    '<office:body><office:text>'+bodyXml+'</office:text></office:body></office:document-content>';
  var manifest = '<?xml version="1.0" encoding="UTF-8"?>\n'+
    '<manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.2">'+
    '<manifest:file-entry manifest:full-path="/" manifest:version="1.2" manifest:media-type="application/vnd.oasis.opendocument.text"/>'+
    '<manifest:file-entry manifest:full-path="content.xml" manifest:media-type="text/xml"/></manifest:manifest>';
  var zip = new window.JSZip();
  zip.file('mimetype','application/vnd.oasis.opendocument.text', {compression:'STORE'});
  zip.folder('META-INF').file('manifest.xml', manifest);
  zip.file('content.xml', contentXml);
  return zip.generateAsync({type:'blob', mimeType: MIME_MAP.odt});
}

var DocConverter = {
  extract: { txt:extractTXT, md:extractMD, docx:extractDOCX, doc:extractDOC, pdf:extractPDF, odt:extractODT,
             xlsx:extractXLSX, csv:extractCSVFile, json:extractJSONFile, xml:extractXMLFile },
  generate: { txt:generateTXT, md:generateMD, docx:generateDOCX, pdf:generatePDF, odt:generateODT,
              xlsx:generateXLSX, csv:generateCSV, json:generateJSON, xml:generateXML, html:generateHTML }
};

/* ---------------- pdf <-> image ---------------- */
var pdfWorkerReady = false;
function ensurePdfWorker(){
  if (pdfWorkerReady || !window.pdfjsLib) return;
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.js';
  pdfWorkerReady = true;
}
var RASTER_MIME = { jpg:'image/jpeg', png:'image/png', webp:'image/webp' };

async function pdfToImages(file, targetFmt, onProgress){
  ensurePdfWorker();
  var buf = await file.arrayBuffer();
  var pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  var blobs = [];
  for (var i=1;i<=pdf.numPages;i++){
    var page = await pdf.getPage(i);
    var viewport = page.getViewport({scale:2});
    var canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    var ctx = canvas.getContext('2d');
    await page.render({canvasContext:ctx, viewport:viewport}).promise;
    var blob = await new Promise(function(resolve){ canvas.toBlob(resolve, RASTER_MIME[targetFmt]||'image/png', 0.92); });
    blobs.push(blob);
    if (onProgress) onProgress(Math.round(i/pdf.numPages*100));
  }
  if (blobs.length===1) return { blob: blobs[0], multi:false, ext: targetFmt };
  var zip = new window.JSZip();
  blobs.forEach(function(b,idx){ zip.file('page-'+(idx+1)+'.'+targetFmt, b); });
  var zipBlob = await zip.generateAsync({type:'blob'});
  return { blob: zipBlob, multi:true, count: blobs.length, ext:'zip' };
}

function loadImageFromBlob(blob){
  return new Promise(function(resolve,reject){
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function(){ resolve({img:img, url:url}); };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('Could not decode image')); };
    img.src = url;
  });
}

async function imagesToPdf(files, onProgress){
  var jsPDF = window.jspdf.jsPDF;
  var doc = null;
  for (var i=0;i<files.length;i++){
    var res = await loadImageFromBlob(files[i]);
    var img = res.img;
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    var canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
    var ctx = canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
    URL.revokeObjectURL(res.url);
    var dataUrl = canvas.toDataURL('image/png');
    var orientation = w>h ? 'l' : 'p';
    if (!doc) doc = new jsPDF({unit:'pt', format:[w,h], orientation:orientation});
    else doc.addPage([w,h], orientation);
    doc.addImage(dataUrl,'PNG',0,0,w,h);
    if (onProgress) onProgress(Math.round((i+1)/files.length*100));
  }
  return doc.output('blob');
}

/* ============================================================
   MEDIA CONVERTER — ffmpeg.wasm, lazy loaded
   ============================================================ */
var MediaConverter = (function(){
  var ffmpeg=null, loaded=false, loadingPromise=null;

  function setEngineUI(state, pct){
    var badge=document.getElementById('engineBadge'), text=document.getElementById('engineText');
    badge.classList.remove('loading','ready');
    if (state==='loading'){ badge.classList.add('loading'); text.textContent='Engine loading'+(pct!=null?' '+pct+'%':'…'); }
    else if (state==='ready'){ badge.classList.add('ready'); text.textContent='Engine ready'; }
    else { text.textContent='Engine idle'; }
  }

  function ensureLoaded(onProgress){
    if (loaded) return Promise.resolve();
    if (loadingPromise) return loadingPromise;
    setEngineUI('loading',0);
    loadingPromise = loadScriptOnce('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js')
      .then(function(){ return loadScriptOnce('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js'); })
      .then(function(){
        var FFmpeg = window.FFmpegWASM.FFmpeg;
        var toBlobURL = window.FFmpegUtil.toBlobURL;
        ffmpeg = new FFmpeg();
        ffmpeg.on('progress', function(e){
          var pct = Math.max(0, Math.min(100, Math.round((e.progress||0)*100)));
          setEngineUI('loading', pct);
          if (onProgress) onProgress(pct);
        });
        var baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';
        return Promise.all([
          toBlobURL(baseURL+'/ffmpeg-core.js','text/javascript'),
          toBlobURL(baseURL+'/ffmpeg-core.wasm','application/wasm')
        ]).then(function(urls){ return ffmpeg.load({coreURL:urls[0], wasmURL:urls[1]}); });
      })
      .then(function(){ loaded=true; setEngineUI('ready'); })
      .catch(function(err){ loadingPromise=null; setEngineUI('idle'); throw err; });
    return loadingPromise;
  }

  function run(input, sourceFmt, targetFmt, buildArgs, onProgress){
    return ensureLoaded(onProgress).then(function(){
      var fetchFile = window.FFmpegUtil.fetchFile;
      var inName = 'in_'+Date.now()+Math.random().toString(36).slice(2)+'.'+sourceFmt;
      var outName = 'out_'+Date.now()+Math.random().toString(36).slice(2)+'.'+targetFmt;
      return fetchFile(input).then(function(data){ return ffmpeg.writeFile(inName, data); })
        .then(function(){ return ffmpeg.exec(buildArgs(inName, outName)); })
        .then(function(){ return ffmpeg.readFile(outName); })
        .then(function(data){
          ffmpeg.deleteFile(inName).catch(function(){});
          ffmpeg.deleteFile(outName).catch(function(){});
          return new Blob([data.buffer], {type: MIME_MAP[targetFmt]||'application/octet-stream'});
        });
    });
  }

  function buildAVArgs(sourceFmt, targetFmt, opts){
    opts = opts || {};
    return function(i,o){
      var args = ['-i', i];
      if (opts.trimStart) args.push('-ss', opts.trimStart);
      if (opts.trimEnd) args.push('-to', opts.trimEnd);
      if (AUDIO_FORMATS.indexOf(targetFmt)!==-1){
        args.push('-vn');
        var br = opts.bitrate || '192k';
        if (targetFmt==='mp3') args.push('-c:a','libmp3lame','-b:a',br);
        else if (targetFmt==='wav') args.push('-c:a','pcm_s16le');
        else args.push('-c:a','aac','-b:a',br);
      } else if (targetFmt==='gif'){
        args.push('-vf','fps=12,scale=480:-1:flags=lanczos');
      } else {
        var vf=[];
        if (opts.resolution && opts.resolution!=='original') vf.push('scale=-2:'+opts.resolution.replace('p',''));
        if (opts.fps && opts.fps!=='original') vf.push('fps='+opts.fps);
        if (vf.length) args.push('-vf', vf.join(','));
        args.push('-c:v','libx264','-preset','fast','-crf', String(opts.crf||23), '-c:a','aac','-b:a', opts.bitrate||'192k');
      }
      args.push(o);
      return args;
    };
  }

  function convertAV(file, sourceFmt, targetFmt, opts, onProgress){
    return run(file, sourceFmt, targetFmt, buildAVArgs(sourceFmt, targetFmt, opts), onProgress);
  }
  function imageConvert(input, sourceFmt, targetFmt, onProgress){
    return run(input, sourceFmt, targetFmt, function(i,o){
      if (sourceFmt==='gif' && targetFmt!=='gif') return ['-i',i,'-vframes','1',o];
      if (targetFmt==='gif') return ['-i',i,'-vf','fps=12,scale=480:-1:flags=lanczos',o];
      return ['-i',i,o];
    }, onProgress);
  }

  function mergeAudio(files, targetFmt, onProgress){
    return ensureLoaded(onProgress).then(function(){
      var fetchFile = window.FFmpegUtil.fetchFile;
      var names = [];
      return files.reduce(function(p, f, idx){
        return p.then(function(){
          var nm = 'm'+idx+'.'+normExt(f.name);
          names.push(nm);
          return fetchFile(f).then(function(data){ return ffmpeg.writeFile(nm, data); });
        });
      }, Promise.resolve()).then(function(){
        var inputArgs = [];
        names.forEach(function(n){ inputArgs.push('-i', n); });
        var filterInputs = names.map(function(_,idx){ return '['+idx+':a]'; }).join('');
        var filter = filterInputs + 'concat=n='+names.length+':v=0:a=1[out]';
        var outName = 'merged.'+targetFmt;
        var codecArgs = targetFmt==='mp3' ? ['-c:a','libmp3lame','-b:a','192k']
                        : targetFmt==='wav' ? ['-c:a','pcm_s16le']
                        : ['-c:a','aac','-b:a','192k'];
        var args = inputArgs.concat(['-filter_complex', filter, '-map', '[out]']).concat(codecArgs).concat([outName]);
        return ffmpeg.exec(args).then(function(){ return ffmpeg.readFile(outName); }).then(function(data){
          names.forEach(function(n){ ffmpeg.deleteFile(n).catch(function(){}); });
          ffmpeg.deleteFile(outName).catch(function(){});
          return new Blob([data.buffer], {type: MIME_MAP[targetFmt]||'application/octet-stream'});
        });
      });
    });
  }

  return { convertAV:convertAV, imageConvert:imageConvert, mergeAudio:mergeAudio, setEngineUI:setEngineUI };
})();

/* ============================================================
   IMAGE CONVERTER + TOOLS
   ============================================================ */
function rasterConvert(file, targetFmt, quality){
  return loadImageFromBlob(file).then(function(res){
    var img=res.img;
    var canvas=document.createElement('canvas');
    canvas.width=img.naturalWidth||img.width; canvas.height=img.naturalHeight||img.height;
    var ctx=canvas.getContext('2d');
    if (targetFmt==='jpg'){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
    ctx.drawImage(img,0,0);
    URL.revokeObjectURL(res.url);
    return new Promise(function(resolve,reject){
      canvas.toBlob(function(blob){ blob?resolve(blob):reject(new Error('Encoding failed')); }, RASTER_MIME[targetFmt]||'image/png', quality==null?0.92:quality);
    });
  });
}
function rasterToSvg(blob){
  return Promise.all([loadImageFromBlob(blob), blobToDataURL(blob)]).then(function(res){
    var img=res[0].img, dataUrl=res[1];
    var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
    URL.revokeObjectURL(res[0].url);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
      '<image width="'+w+'" height="'+h+'" href="'+dataUrl+'"/></svg>';
    return new Blob([svg],{type:'image/svg+xml'});
  });
}
function svgToRaster(file, targetFmt){
  return file.text().then(function(text){
    var blob = new Blob([text],{type:'image/svg+xml'});
    return loadImageFromBlob(blob).then(function(res){
      var img=res.img;
      var w=img.naturalWidth||800, h=img.naturalHeight||600;
      var canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      var ctx=canvas.getContext('2d');
      if (targetFmt==='jpg'){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); }
      ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(res.url);
      return new Promise(function(resolve,reject){
        canvas.toBlob(function(b){ b?resolve(b):reject(new Error('Encoding failed')); }, RASTER_MIME[targetFmt]||'image/png', 0.92);
      });
    });
  });
}
var ImgConverter = {
  convert: function(file, sourceFmt, targetFmt, onProgress){
    if (sourceFmt===targetFmt) return rasterConvert(file, targetFmt);
    if (sourceFmt==='gif' && targetFmt==='svg') return MediaConverter.imageConvert(file,'gif','png',onProgress).then(rasterToSvg);
    if (sourceFmt==='svg' && targetFmt==='gif') return svgToRaster(file,'png').then(function(png){ return MediaConverter.imageConvert(png,'png','gif',onProgress); });
    if (sourceFmt==='gif' || targetFmt==='gif') return MediaConverter.imageConvert(file, sourceFmt, targetFmt, onProgress);
    if (sourceFmt==='svg') return svgToRaster(file, targetFmt);
    if (targetFmt==='svg') return rasterToSvg(file);
    return rasterConvert(file, targetFmt);
  }
};

/* ---- image tool: resize ---- */
function resizeImage(file, w, h){
  return loadImageFromBlob(file).then(function(res){
    var canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
    var ctx=canvas.getContext('2d'); ctx.drawImage(res.img,0,0,w,h);
    URL.revokeObjectURL(res.url);
    var type = MIME_MAP[normExt(file.name)] && RASTER_MIME[normExt(file.name)] ? RASTER_MIME[normExt(file.name)] : 'image/png';
    return new Promise(function(resolve,reject){ canvas.toBlob(function(b){ b?resolve(b):reject(new Error('Resize failed')); }, type, 0.92); });
  });
}
/* ---- image tool: compress (re-encode at quality) ---- */
function compressImage(file, quality){
  var ext = normExt(file.name);
  var targetFmt = (ext==='png') ? 'png' : 'jpg'; // png stays lossless-ish, others go through jpeg for real size reduction
  return rasterConvert(file, targetFmt, quality);
}
/* ---- image tool: crop (rect in natural pixel coords) ---- */
function cropImage(file, rect){
  return loadImageFromBlob(file).then(function(res){
    var canvas=document.createElement('canvas'); canvas.width=rect.w; canvas.height=rect.h;
    var ctx=canvas.getContext('2d');
    ctx.drawImage(res.img, rect.x, rect.y, rect.w, rect.h, 0, 0, rect.w, rect.h);
    URL.revokeObjectURL(res.url);
    return new Promise(function(resolve,reject){ canvas.toBlob(function(b){ b?resolve(b):reject(new Error('Crop failed')); }, 'image/png', 0.95); });
  });
}
/* ---- image tool: background removal (lazy ML model) ---- */
function removeBackground(file, onProgress){
  return importOnce('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm').then(function(mod){
    var fn = mod.removeBackground || mod.default;
    return fn(file, {
      model:'small',
      progress: function(key,current,total){ if(onProgress && total) onProgress(Math.round(current/total*100)); }
    });
  });
}
/* ---- image tool: OCR ---- */
function runOCR(file, onProgress){
  return window.Tesseract.recognize(file, 'eng', {
    logger: function(m){ if (onProgress && m.status==='recognizing text' && m.progress!=null) onProgress(Math.round(m.progress*100)); }
  }).then(function(result){ return result.data.text; });
}

/* ============================================================
   PDF TOOLS — pdf-lib, loaded lazily via ESM
   ============================================================ */
var PdfTools = (function(){
  function getLib(){ return importOnce('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm'); }
  function getEncLib(){ return importOnce('https://cdn.jsdelivr.net/npm/pdf-lib-with-encrypt@1.2.1/+esm'); }

  function mergePdfs(files, onProgress){
    return getLib().then(async function(PDFLib){
      var out = await PDFLib.PDFDocument.create();
      for (var i=0;i<files.length;i++){
        var bytes = await files[i].arrayBuffer();
        var src = await PDFLib.PDFDocument.load(bytes);
        var pages = await out.copyPages(src, src.getPageIndices());
        pages.forEach(function(p){ out.addPage(p); });
        if (onProgress) onProgress(Math.round((i+1)/files.length*100));
      }
      var bytes2 = await out.save();
      return new Blob([bytes2], {type:'application/pdf'});
    });
  }

  function parseRanges(spec, pageCount){
    var indices = [];
    spec.split(',').forEach(function(part){
      part = part.trim(); if (!part) return;
      var m = part.match(/^(\d+)\s*-\s*(\d+)$/);
      if (m){
        var a=parseInt(m[1],10), b=parseInt(m[2],10);
        for (var i=a;i<=b;i++) if (i>=1 && i<=pageCount) indices.push(i-1);
      } else {
        var n = parseInt(part,10);
        if (n>=1 && n<=pageCount) indices.push(n-1);
      }
    });
    return indices;
  }

  function splitAllPages(file, onProgress){
    return getLib().then(async function(PDFLib){
      var bytes = await file.arrayBuffer();
      var src = await PDFLib.PDFDocument.load(bytes);
      var count = src.getPageCount();
      var zip = new window.JSZip();
      for (var i=0;i<count;i++){
        var doc = await PDFLib.PDFDocument.create();
        var pages = await doc.copyPages(src, [i]);
        doc.addPage(pages[0]);
        var b = await doc.save();
        zip.file('page-'+(i+1)+'.pdf', b);
        if (onProgress) onProgress(Math.round((i+1)/count*100));
      }
      var zipBlob = await zip.generateAsync({type:'blob'});
      return { blob: zipBlob, count: count };
    });
  }

  function splitRange(file, rangeSpec){
    return getLib().then(async function(PDFLib){
      var bytes = await file.arrayBuffer();
      var src = await PDFLib.PDFDocument.load(bytes);
      var count = src.getPageCount();
      var indices = parseRanges(rangeSpec, count);
      if (!indices.length) throw new Error('No valid pages in that range');
      var doc = await PDFLib.PDFDocument.create();
      var pages = await doc.copyPages(src, indices);
      pages.forEach(function(p){ doc.addPage(p); });
      var b = await doc.save();
      return new Blob([b], {type:'application/pdf'});
    });
  }

  function compressPdf(file){
    return getLib().then(async function(PDFLib){
      var bytes = await file.arrayBuffer();
      var doc = await PDFLib.PDFDocument.load(bytes);
      var out = await doc.save({ useObjectStreams:true });
      return new Blob([out], {type:'application/pdf'});
    });
  }

  function watermarkPdf(file, text, opts){
    opts = opts || {};
    return getLib().then(async function(PDFLib){
      var bytes = await file.arrayBuffer();
      var doc = await PDFLib.PDFDocument.load(bytes);
      var font = await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
      var pages = doc.getPages();
      var opacity = opts.opacity!=null ? opts.opacity : 0.28;
      var angle = opts.angle!=null ? opts.angle : 45;
      var size = opts.fontSize || 54;
      pages.forEach(function(page){
        var dims = page.getSize();
        var tw = font.widthOfTextAtSize(text, size);
        page.drawText(text, {
          x: dims.width/2 - tw/2, y: dims.height/2 - size/2, size:size, font:font,
          color: PDFLib.rgb(0.55,0.55,0.55), opacity: opacity, rotate: PDFLib.degrees(angle)
        });
      });
      var out = await doc.save();
      return new Blob([out], {type:'application/pdf'});
    });
  }

  function protectPdf(file, password){
    return getEncLib().then(async function(PDFLib){
      var bytes = await file.arrayBuffer();
      var doc = await PDFLib.PDFDocument.load(bytes);
      if (typeof doc.encrypt !== 'function'){
        throw new Error('Password protection engine is unavailable right now — please try again later.');
      }
      await doc.encrypt({ userPassword: password, ownerPassword: password });
      var out = await doc.save();
      return new Blob([out], {type:'application/pdf'});
    });
  }

  return { mergePdfs:mergePdfs, splitAllPages:splitAllPages, splitRange:splitRange, compressPdf:compressPdf, watermarkPdf:watermarkPdf, protectPdf:protectPdf };
})();

    '<div id="cvPreviewArea"></div>';
  document.getElementById('cvConvertBtn').addEventListener('click', runConvert);
  if (cv.category==='img') renderImgTools(); else document.getElementById('cvImgTools').style.display='none';
}

function runConvert(){
  var targetFmt = document.getElementById('cvTargetFmt').value;
  var statusLine=document.getElementById('cvStatusLine'), btn=document.getElementById('cvConvertBtn');
  var track=document.getElementById('cvProgressTrack'), fill=document.getElementById('cvProgressFill');
  btn.disabled=true; statusLine.className='status-line'; statusLine.textContent='Converting…';
  track.classList.add('show'); fill.style.width='5%';
  function onProgress(pct){ fill.style.width=pct+'%'; statusLine.textContent='Converting… '+pct+'%'; }

  var work;
  if (cv.category==='doc'){
    if (cv.ext==='pdf' && (targetFmt==='jpg'||targetFmt==='png')){
      work = pdfToImages(cv.file, targetFmt, onProgress).then(function(res){ return {blob:res.blob, ext:res.ext, multi:res.multi, count:res.count}; });
    } else {
      work = DocConverter.extract[cv.ext](cv.file).then(function(model){
        return DocConverter.generate[targetFmt](model).then(function(blob){ return {blob:blob, model:model, ext:targetFmt}; });
      });
    }
  } else if (cv.category==='img'){
    work = ImgConverter.convert(cv.file, cv.ext, targetFmt, onProgress).then(function(blob){ return {blob:blob, ext:targetFmt}; });
  } else {
    var opts={};
    if (cv.category==='audio'){
      opts.bitrate=document.getElementById('cvBitrate').value;
      opts.trimStart=document.getElementById('cvTrimStart').value.trim()||null;
      opts.trimEnd=document.getElementById('cvTrimEnd').value.trim()||null;
    } else {
      opts.resolution=document.getElementById('cvResolution').value;
      opts.fps=document.getElementById('cvFps').value;
      opts.crf=document.getElementById('cvCrf').value;
      opts.trimStart=document.getElementById('cvTrimStart').value.trim()||null;
      opts.trimEnd=document.getElementById('cvTrimEnd').value.trim()||null;
    }
    work = MediaConverter.convertAV(cv.file, cv.ext, targetFmt, opts, onProgress).then(function(blob){ return {blob:blob, ext:targetFmt}; });
  }

  work.then(function(res){
    btn.disabled=false; track.classList.remove('show');
    statusLine.className='status-line ok'; statusLine.textContent='Done — '+formatBytes(res.blob.size);
    if (cv.resultUrl) URL.revokeObjectURL(cv.resultUrl);
    cv.resultUrl = URL.createObjectURL(res.blob);
    var downloadName = res.multi ? (baseName(cv.file.name)+'-pages.zip') : (baseName(cv.file.name)+'.'+(res.ext||targetFmt));
    logHistory({ name: cv.file.name, action: cv.ext.toUpperCase()+' → '+(res.ext||targetFmt).toUpperCase(), size: res.blob.size });
    renderCvPreview(targetFmt, res, downloadName);
  }).catch(function(err){
    btn.disabled=false; track.classList.remove('show');
    statusLine.className='status-line err'; statusLine.textContent='Failed: '+(err&&err.message?err.message:'conversion error');
  });
}

function renderCvPreview(targetFmt, res, downloadName){
  var area=document.getElementById('cvPreviewArea');
  var html = '<div class="preview-wrap"><div class="field-label">Preview</div>';
  if (res.multi){
    html += '<div class="preview-box"><pre>'+res.count+' pages exported as a ZIP of images.</pre></div>';
  } else if (IMG_FORMATS.indexOf(targetFmt)!==-1){
    var checker = (targetFmt==='png'||targetFmt==='webp'||targetFmt==='gif'||targetFmt==='svg') ? ' checker' : '';
    html += '<div class="preview-box'+checker+'"><img src="'+cv.resultUrl+'"></div>';
  } else if (AUDIO_FORMATS.indexOf(targetFmt)!==-1){
    html += '<div class="preview-box"><div style="padding:14px;"><audio controls src="'+cv.resultUrl+'" style="width:100%;"></audio></div></div>';
  } else if (VIDEO_FORMATS.indexOf(targetFmt)!==-1){
    html += '<div class="preview-box"><video controls src="'+cv.resultUrl+'"></video></div>';
  } else if (res.model && res.model.rows && res.model.rows.length){
    var rows = res.model.rows.slice(0,16);
    html += '<div class="preview-box"><table><thead><tr>'+rows[0].map(function(h){return '<th>'+escapeHtml(h)+'</th>';}).join('')+'</tr></thead><tbody>';
    rows.slice(1).forEach(function(r){ html += '<tr>'+r.map(function(c){return '<td>'+escapeHtml(c)+'</td>';}).join('')+'</tr>'; });
    html += '</tbody></table></div>';
  } else if (res.model){
    var text=(res.model.text||'').slice(0,4000);
    html += '<div class="preview-box"><pre>'+escapeHtml(text)+(res.model.text && res.model.text.length>4000?'\n…':'')+'</pre></div>';
  } else {
    html += '<div class="preview-box"><pre>Preview not available for this format — download to view.</pre></div>';
  }
  html += '<a class="download-btn" href="'+cv.resultUrl+'" download="'+escapeHtml(downloadName)+'">Download '+downloadName.split('.').pop().toUpperCase()+'</a></div>';
  area.innerHTML = html;
}

function setupCropper(img, natW, natH){
  var stage=document.getElementById('cropStage'), rectEl=document.getElementById('cropRect');
  var scale = img.clientWidth / natW;
  var rect = { x:natW*0.1, y:natH*0.1, w:natW*0.8, h:natH*0.8 };
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function applyStyle(){
    rectEl.style.left=(rect.x*scale)+'px'; rectEl.style.top=(rect.y*scale)+'px';
    rectEl.style.width=(rect.w*scale)+'px'; rectEl.style.height=(rect.h*scale)+'px';
  }
  applyStyle();
  var mode=null, startPt=null, startRect=null;
  function toLocal(e){ var b=stage.getBoundingClientRect(); return { x:(e.clientX-b.left)/scale, y:(e.clientY-b.top)/scale }; }
  function onMove(e){
    if (!mode) return;
    var p=toLocal(e), dx=p.x-startPt.x, dy=p.y-startPt.y;
    if (mode==='move'){
      rect.x=clamp(startRect.x+dx, 0, natW-rect.w); rect.y=clamp(startRect.y+dy, 0, natH-rect.h);
    } else if (mode==='se'){
      rect.w=clamp(startRect.w+dx, 20, natW-rect.x); rect.h=clamp(startRect.h+dy, 20, natH-rect.y);
    } else if (mode==='ne'){
      var nw=clamp(startRect.w+dx, 20, natW-rect.x), nh=clamp(startRect.h-dy, 20, startRect.y+startRect.h);
      rect.y=startRect.y+startRect.h-nh; rect.w=nw; rect.h=nh;
    } else if (mode==='nw'){
      var nw2=clamp(startRect.w-dx, 20, startRect.x+startRect.w), nh2=clamp(startRect.h-dy, 20, startRect.y+startRect.h);
      rect.x=startRect.x+startRect.w-nw2; rect.y=startRect.y+startRect.h-nh2; rect.w=nw2; rect.h=nh2;
    } else if (mode==='sw'){
      var nw3=clamp(startRect.w-dx, 20, startRect.x+startRect.w), nh3=clamp(startRect.h+dy, 20, natH-startRect.y);
      rect.x=startRect.x+startRect.w-nw3; rect.w=nw3; rect.h=nh3;
    }
    applyStyle();
  }
  function onUp(){ mode=null; document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp); }
  function bindHandle(el, m){ el.addEventListener('pointerdown', function(e){ e.preventDefault(); e.stopPropagation(); mode=m; startPt=toLocal(e); startRect={x:rect.x,y:rect.y,w:rect.w,h:rect.h}; document.addEventListener('pointermove', onMove); document.addEventListener('pointerup', onUp); }); }
  bindHandle(rectEl, 'move');
  bindHandle(rectEl.querySelector('.nw'), 'nw');
  bindHandle(rectEl.querySelector('.ne'), 'ne');
  bindHandle(rectEl.querySelector('.sw'), 'sw');
  bindHandle(rectEl.querySelector('.se'), 'se');

  document.getElementById('cropApply').addEventListener('click', function(){
    var st=document.getElementById('cropStatus'); st.className='status-line'; st.textContent='Cropping…';
    cropImage(cv.file, {x:Math.round(rect.x), y:Math.round(rect.y), w:Math.round(rect.w), h:Math.round(rect.h)}).then(function(blob){
      st.className='status-line ok'; st.textContent='Done — '+formatBytes(blob.size);
      var url=URL.createObjectURL(blob);
      logHistory({name:cv.file.name, action:'Crop', size:blob.size});
      document.getElementById('cropPreview').innerHTML='<div class="preview-wrap"><div class="preview-box checker"><img src="'+url+'"></div>'+
        '<a class="download-btn" href="'+url+'" download="cropped-'+escapeHtml(baseName(cv.file.name))+'.png">Download</a></div>';
    }).catch(function(err){ st.className='status-line err'; st.textContent='Failed: '+err.message; });
  });
}

function multiFileZone(containerId, accept, state){
  var el=document.getElementById(containerId);
  function render(){
    var listHtml = state.files.map(function(f,i){
      return '<div class="multi-item"><span class="idx">'+(i+1)+'</span><span class="nm">'+escapeHtml(f.name)+'</span><span class="sz">'+formatBytes(f.size)+'</span>'+
        '<div class="iconbtns">'+(i>0?'<div class="mini-icon" data-up="'+i+'">&#8593;</div>':'')+(i<state.files.length-1?'<div class="mini-icon" data-down="'+i+'">&#8595;</div>':'')+'<div class="mini-icon" data-rm="'+i+'">&#10005;</div></div></div>';
    }).join('');
    el.innerHTML = '<div class="dropzone" style="min-height:100px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12m0-12 4 4m-4-4-4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><p>Drop files, or</p><label class="btn sm">Add files<input type="file" multiple accept="'+accept+'"></label></div>'+
      '<div class="multi-list">'+listHtml+'</div>';
    var dz=el.querySelector('.dropzone'), input=el.querySelector('input');
    dz.addEventListener('click', function(e){ if(e.target.tagName!=='INPUT') input.click(); });
    input.addEventListener('change', function(){ addFiles(input.files); input.value=''; });
    ['dragenter','dragover'].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add('drag'); }); });
    ['dragleave','drop'].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove('drag'); }); });
    dz.addEventListener('drop', function(e){ addFiles(e.dataTransfer.files); });
    Array.prototype.forEach.call(el.querySelectorAll('[data-rm]'), function(b){ b.addEventListener('click', function(){ state.files.splice(parseInt(b.getAttribute('data-rm'),10),1); render(); if(state.onChange) state.onChange(); }); });
    Array.prototype.forEach.call(el.querySelectorAll('[data-up]'), function(b){ b.addEventListener('click', function(){ var i=parseInt(b.getAttribute('data-up'),10); var t=state.files[i-1]; state.files[i-1]=state.files[i]; state.files[i]=t; render(); if(state.onChange) state.onChange(); }); });
    Array.prototype.forEach.call(el.querySelectorAll('[data-down]'), function(b){ b.addEventListener('click', function(){ var i=parseInt(b.getAttribute('data-down'),10); var t=state.files[i+1]; state.files[i+1]=state.files[i]; state.files[i]=t; render(); if(state.onChange) state.onChange(); }); });
  }
  function addFiles(fileList){ Array.prototype.forEach.call(fileList, function(f){ state.files.push(f); }); render(); if(state.onChange) state.onChange(); }
  render();
}

/* ============================================================
   BATCH PANEL
   ============================================================ */
var batchQueue=[], bqid=0, batchConvertChain=Promise.resolve();

function renderBatchPanel(){
  document.getElementById('panel-batch').innerHTML =
    '<div class="card" style="padding:22px;margin-bottom:20px;">'+
      '<div class="dropzone" id="bqDropzone"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12m0-12 4 4m-4-4-4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><p>Drop any number of files here, or</p><label class="btn primary" style="margin-top:4px;">Browse<input type="file" id="bqFileInput" multiple></label></div>'+
    '</div>'+
    '<div class="queue-head"><div class="field-label" style="margin:0;">Queue</div><div class="queue-actions"><button class="btn ghost" id="bqClear">Clear all</button><button class="btn" id="bqZip">Download all as ZIP</button><button class="btn primary" id="bqConvertAll">Convert all</button></div></div>'+
    '<div class="queue" id="bqQueue"></div><div class="empty-hint" id="bqEmpty">No files yet.</div>';
  var dz=document.getElementById('bqDropzone'), input=document.getElementById('bqFileInput');
  dz.addEventListener('click', function(e){ if(e.target.tagName!=='INPUT') input.click(); });
  input.addEventListener('change', function(){ addBatchFiles(input.files); input.value=''; });
  ['dragenter','dragover'].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add('drag'); }); });
  ['dragleave','drop'].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove('drag'); }); });
  dz.addEventListener('drop', function(e){ if(e.dataTransfer.files) addBatchFiles(e.dataTransfer.files); });
  document.getElementById('bqClear').addEventListener('click', function(){
    batchQueue.forEach(function(it){ if(it.resultUrl) URL.revokeObjectURL(it.resultUrl); });
    batchQueue=[]; renderBatchQueue();
  });
  document.getElementById('bqConvertAll').addEventListener('click', function(){
    batchQueue.filter(function(it){ return it.category && it.status!=='working'; }).forEach(function(it){ queueBatchConvert(it); });
  });
  document.getElementById('bqZip').addEventListener('click', function(){
    var done = batchQueue.filter(function(it){ return it.status==='done'; });
    if (!done.length){ toast('Nothing converted yet'); return; }
    var zip = new window.JSZip();
    done.forEach(function(it){ zip.file(it.resultName, it.resultBlob); });
    zip.generateAsync({type:'blob'}).then(function(blob){
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download='morph-batch.zip'; document.body.appendChild(a); a.click(); a.remove();
      logHistory({name: done.length+' files', action:'Batch ZIP download', size: blob.size});
    });
  });
  renderBatchQueue();
}
function addBatchFiles(fileList){
  Array.prototype.forEach.call(fileList, function(file){
    var ext=normExt(file.name), category=categoryOf(ext);
    if (!category){ batchQueue.push({id:++bqid,file:file,name:file.name,size:file.size,sourceFmt:ext,category:null,status:'error',statusText:'Unsupported: .'+ext}); return; }
    var targets = targetsFor(ext, category).filter(function(t){return t!==ext;});
    batchQueue.push({id:++bqid,file:file,name:file.name,size:file.size,sourceFmt:ext,category:category,targetFmt:targets[0],status:'idle',statusText:'Ready'});
  });
  renderBatchQueue();
}
function removeBatchItem(id){
  var it=batchQueue.filter(function(q){return q.id===id;})[0];
  if (it && it.resultUrl) URL.revokeObjectURL(it.resultUrl);
  batchQueue = batchQueue.filter(function(q){return q.id!==id;});
  renderBatchQueue();
}
function convertBatchItem(item){
  if (!item.category || !item.targetFmt) return Promise.reject(new Error('no target'));
  item.status='working'; item.statusText='Converting…'; renderBatchQueue();
  var onProgress=function(pct){ item.statusText='Converting… '+pct+'%'; renderBatchQueue(); };
  var task;
  if (item.category==='doc'){
    if (item.sourceFmt==='pdf' && (item.targetFmt==='jpg'||item.targetFmt==='png')){
      task = pdfToImages(item.file, item.targetFmt, onProgress).then(function(r){ return r.blob; });
    } else {
      task = DocConverter.extract[item.sourceFmt](item.file).then(function(model){ return DocConverter.generate[item.targetFmt](model); });
    }
  } else if (item.category==='img'){
    task = ImgConverter.convert(item.file, item.sourceFmt, item.targetFmt, onProgress);
  } else {
    task = MediaConverter.convertAV(item.file, item.sourceFmt, item.targetFmt, {}, onProgress);
  }
  return task.then(function(blob){
    item.status='done'; item.statusText='Done — '+formatBytes(blob.size);
    if (item.resultUrl) URL.revokeObjectURL(item.resultUrl);
    item.resultBlob=blob; item.resultUrl=URL.createObjectURL(blob);
    item.resultName = baseName(item.name)+'.'+item.targetFmt;
    logHistory({name:item.name, action:item.sourceFmt.toUpperCase()+' → '+item.targetFmt.toUpperCase(), size:blob.size});
    renderBatchQueue();
  }).catch(function(err){
    item.status='error'; item.statusText='Failed: '+(err&&err.message?err.message:'error'); renderBatchQueue();
  });
}
function queueBatchConvert(item){ batchConvertChain = batchConvertChain.then(function(){ return convertBatchItem(item); }); return batchConvertChain; }

function renderBatchQueue(){
  var listEl=document.getElementById('bqQueue'), emptyEl=document.getElementById('bqEmpty');
  if (!listEl) return;
  emptyEl.style.display = batchQueue.length?'none':'block';
  listEl.innerHTML = batchQueue.map(function(it){
    if (!it.category){
      return '<div class="card qrow"><div class="row-info"><div class="row-name">'+escapeHtml(it.name)+'</div><div class="row-meta">'+formatBytes(it.size)+'</div></div>'+
        '<div class="qstatus err">'+escapeHtml(it.statusText)+'</div><div class="qactions"><button class="mini-icon" data-rm="'+it.id+'">&#10005;</button></div></div>';
    }
    var targets = targetsFor(it.sourceFmt, it.category).filter(function(t){return t!==it.sourceFmt;});
    var options = targets.map(function(t){ return '<option value="'+t+'"'+(t===it.targetFmt?' selected':'')+'>'+t.toUpperCase()+'</option>'; }).join('');
    var sigClass = it.status==='working'?'converting':it.status==='done'?'done':it.status==='error'?'error':'';
    var statusClass = it.status==='done'?'ok':it.status==='error'?'err':'';
    var dlBtn = it.status==='done' ? '<a class="mini-icon" href="'+it.resultUrl+'" download="'+escapeHtml(it.resultName)+'" title="Download">&#8595;</a>' : '<button class="mini-icon" disabled>&#8595;</button>';
    return '<div class="card qrow">'+
      '<div class="row-info"><div class="row-name">'+escapeHtml(it.name)+'</div><div class="row-meta">'+formatBytes(it.size)+'</div></div>'+
      '<div class="route"><span class="fmt-node">'+it.sourceFmt.toUpperCase()+'</span><div class="signal '+sigClass+'"><div class="dot"></div></div>'+
      '<select class="target-sm" data-target="'+it.id+'">'+options+'</select></div>'+
      '<div class="qstatus '+statusClass+'">'+escapeHtml(it.statusText)+'</div>'+
      '<div class="qactions"><button class="mini-icon" data-convert="'+it.id+'" title="Convert">&#9654;</button>'+dlBtn+'<button class="mini-icon" data-rm="'+it.id+'" title="Remove">&#10005;</button></div>'+
    '</div>';
  }).join('');
  Array.prototype.forEach.call(listEl.querySelectorAll('[data-rm]'), function(b){ b.addEventListener('click', function(){ removeBatchItem(parseInt(b.getAttribute('data-rm'),10)); }); });
  Array.prototype.forEach.call(listEl.querySelectorAll('[data-convert]'), function(b){ b.addEventListener('click', function(){ var it=batchQueue.filter(function(q){return q.id===parseInt(b.getAttribute('data-convert'),10);})[0]; if(it) queueBatchConvert(it); }); });
  Array.prototype.forEach.call(listEl.querySelectorAll('[data-target]'), function(s){ s.addEventListener('change', function(){ var it=batchQueue.filter(function(q){return q.id===parseInt(s.getAttribute('data-target'),10);})[0]; if(it) it.targetFmt=s.value; }); });
}

/* ============================================================

   ============================================================ */
function renderHistory(){
  var el=document.getElementById('panel-history');
  var list=[]; try{ list=JSON.parse(localStorage.getItem('morph_history')||'[]'); }catch(e){}
  if (!list.length){
    el.innerHTML = '<div class="card" style="padding:44px 20px;text-align:center;color:var(--text-faint);font-size:12.5px;">No conversions yet. Only file names and actions are saved here — never the files themselves.</div>';
    return;
  }
  var rows = list.map(function(h){
    var d = new Date(h.time);
    return '<tr><td>'+escapeHtml(h.name)+'</td><td class="mono">'+escapeHtml(h.action)+'</td><td class="mono">'+formatBytes(h.size||0)+'</td><td class="mono">'+d.toLocaleString()+'</td></tr>';
  }).join('');
  el.innerHTML = '<div class="card" style="overflow:auto;"><table class="hist"><thead><tr><th>File</th><th>Action</th><th>Size</th><th>When</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div style="text-align:right;margin-top:14px;"><button class="btn ghost" id="histClear">Clear history</button></div>';
  document.getElementById('histClear').addEventListener('click', function(){ localStorage.removeItem('morph_history'); renderHistory(); });
}
window.renderHistory = renderHistory;

function switchPanel(name){

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('morph_theme', t);
  document.getElementById('themeIcon').innerHTML = t==='light'
    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
    : '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
}
function init(){
  applyTheme(localStorage.getItem('morph_theme') || 'dark');
  document.getElementById('themeToggle').addEventListener('click', function(){
    applyTheme(document.documentElement.getAttribute('data-theme')==='light' ? 'dark' : 'light');
  });
  document.getElementById('maintabs').addEventListener('click', function(e){
    var btn=e.target.closest('.maintab'); if(!btn) return;
    switchPanel(btn.getAttribute('data-panel'));
  });
  renderConvertShell();
  renderToolsPanel();
  renderBatchPanel();
  renderHistory();
  ensurePdfWorker();
  if (!window.pdfjsLib){ var chk=setInterval(function(){ if(window.pdfjsLib){ ensurePdfWorker(); clearInterval(chk); } }, 200); }
}
document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
